# Production stack for the Dawry server. Reads the root .env (see .env.example,
# "production" section). nginx on the host proxies to the 127.0.0.1 ports.
#   docker compose up -d --build
# Every up/build runs the "migrate" service on the new api image first; the api
# only starts once migrations have finished successfully.
# The server is shared with other projects, so every service has a memory cap.
name: dawry

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-api-env: &api-env
  DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL}
  WEB_ORIGIN: ${WEB_ORIGIN}
  APP_TIME_ZONE: ${APP_TIME_ZONE:-Africa/Cairo}
  API_PORT: 4000
  NODE_ENV: production

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 768m
    logging: *logging

  migrate:
    image: dawry-api
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["node", "dist/migrate.js"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment: *api-env
    mem_limit: 384m
    logging: *logging

  api:
    image: dawry-api
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *api-env
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    mem_limit: 384m
    logging: *logging

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        API_INTERNAL_URL: http://api:4000
    environment:
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Africa/Cairo}
    restart: unless-stopped
    init: true
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    mem_limit: 512m
    logging: *logging

volumes:
  mysql-data:
